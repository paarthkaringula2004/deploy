global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - scheme: https
      api_version: v2
      http_sd_configs:
        - url: https://ai-force-ops.onrender.com/api/prometheus/discovery/alertmanager
          refresh_interval: 15s
          authorization:
            type: Bearer
            credentials_file: /etc/secrets/prometheus_metrics_token
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: Prometheus

  - job_name: alertmanager
    scrape_interval: 15s
    http_sd_configs:
      - url: https://ai-force-ops.onrender.com/api/prometheus/discovery/alertmanager
        refresh_interval: 15s
        authorization:
          type: Bearer
          credentials_file: /etc/secrets/prometheus_metrics_token

