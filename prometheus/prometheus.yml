global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - scheme: https
      api_version: v2
      static_configs:
        - targets: [eassist-alertmanager-emc7.onrender.com]
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: Prometheus

  - job_name: alertmanager
    scrape_interval: 15s
    scheme: https
    static_configs:
      - targets: [eassist-alertmanager-emc7.onrender.com]
        labels:
          service: Alertmanager

